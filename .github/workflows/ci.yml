# Runs on every pull request and on pushes to main.
# Backend tests are fully offline (all upstream feeds are mocked), so CI never
# depends on PassioGo or USF's GTFS-Realtime feeds being reachable.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.15)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend lint + build (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]  # 24 = current LTS, 26 = version used for local development
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Lint (warnings fail the build)
        run: npm run lint -- --deny-warnings
      - name: Production build
        run: npm run build
